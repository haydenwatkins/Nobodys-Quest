  <div id="game-wrap">
    <canvas id="game" width="320" height="180"></canvas>
  </div>
  <!-- Text & HUD render on this full-resolution layer so words stay
       razor-sharp while the game world below stays chunky-pixel. -->
  <canvas id="ui"></canvas>

  <!-- Touch controls (only visible on touch devices) -->
  <div id="touch-ui">
    <div id="joy-zone"></div>
    <div id="btn-zone">
      <button class="abtn" id="btn-swap" aria-label="Tap to switch form; hold for form wheel"><span>⇄</span><small>HOLD</small></button>
      <button class="abtn big" id="btn-a">A</button>
      <button class="abtn" id="btn-b">B</button>
      <button class="abtn" id="btn-c">C</button>
      <button class="abtn" id="btn-ultimate" aria-label="Legend ultimate">✦</button>
    </div>
    <button id="btn-map" aria-label="Tap for the Wayfinder map; hold to ask for guidance">🧭<small>HOLD</small></button>
    <button id="btn-pause">☰</button>
  </div>

  <!-- Long-press form selector. Gameplay pauses while this is open. -->
  <div id="form-wheel" class="hidden" aria-hidden="true"></div>

  <!-- Fast in-world ability mixing. Open with R3/F or hold touch B/C. -->
  <div id="art-mixer" class="hidden" aria-hidden="true"></div>

  <!-- Each adventure gets its own slot; the final story scene lives above gameplay. -->
  <div id="save-slots" class="hidden"></div>
  <div id="story-ending" class="hidden"></div>

  <!-- Pause menu / form workshop overlays are built by ui.js -->
  <div id="menu" class="hidden"></div>
  <div id="workshop-errors" class="hidden"></div>
